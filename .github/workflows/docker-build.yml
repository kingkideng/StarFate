name: Build and Push Docker Image

on:
  push:
    branches: [ "main", "master" ]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码 (Checkout)
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx (Setup Buildx)
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry (Login to GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 准备镜像名 (Prepare Image Name)
        run: |
          echo "IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}:latest" >> ${GITHUB_ENV}

      - name: 构建并发布镜像 (Build and Push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}
          build-args: |
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
