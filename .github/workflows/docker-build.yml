name: Build and Push Docker Image

on:
  push:
    branches: [ "main", "master" ] # 当你向 main 分支推送代码时触发

env:
  REGISTRY: ghcr.io # GitHub 容器仓库地址
  IMAGE_NAME: kingkideng/starfate # 必须强制使用小写，否则 Docker 会因为大写字母报错

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 必须赋予写入包的权限，以便推送镜像到 GitHub

    steps:
      - name: 检出代码 (Checkout repository)
        uses: actions/checkout@v4

      - name: 登录到 GitHub 镜像仓库 (Log in to the Container registry)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Github 自动生成的 Token，不需要你手动配置

      - name: 提取镜像标签名 (Extract metadata)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      - name: 构建并发布镜像 (Build and push Docker image)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
